
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="TaskNest is a simple and friendly to-do list application.">

  <title>TaskNest - To-do List</title>

  <!-- External CSS stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Load JavaScript after HTML parsing -->
  <script src="script.js" defer></script>
</head>

<body>
  <main class="app">

    <!-- Application heading -->
    <header class="app-header">
      <h1>TaskNest</h1>
      <p>A little progress every day.</p>
    </header>

    <!-- Form for adding new tasks -->
    <section class="task-form-section">
      <h2>Add a new task</h2>

      <form id="task-form">
        <label for="task-input">Task description</label>

        <input
          type="text"
          id="task-input"
          name="task"
          placeholder="What needs doing?"
          aria-describedby="error-message"
          aria-invalid="false"
          required
        >

        <p
          id="error-message"
          class="error-message"
          role="alert"
          aria-live="polite"
        ></p>

        <button type="submit">+ Add task</button>
      </form>
    </section>

    <!-- Section displaying all tasks -->
    <section class="tasks-section">

      <div class="task-summary">
        <h2>My tasks</h2>
        <p id="task-counter" aria-live="polite">
          0 tasks remaining
        </p>
      </div>

      <!-- Buttons for filtering tasks -->
      <nav class="task-filters" aria-label="Filter tasks">

        <button
          type="button"
          data-filter="all"
          aria-pressed="true"
        >
          All
        </button>

        <button
          type="button"
          data-filter="active"
          aria-pressed="false"
        >
          Active
        </button>

        <button
          type="button"
          data-filter="completed"
          aria-pressed="false"
        >
          Completed
        </button>

      </nav>

      <!-- JavaScript displays tasks inside this list -->
      <ul id="task-list" aria-label="Your tasks"></ul>

      <!-- Message displayed when there are no matching tasks -->
      <p id="empty-message">
        No tasks yet. Add your first task!
      </p>

    </section>

  </main>
</body>
</html>
